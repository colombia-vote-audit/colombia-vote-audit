[project]
name = "cva"
version = "0.1.0"
description = "Fetch pipeline for Colombian congressional voting records"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
sample = ["pypdf>=5.0"]
web = ["starlette>=0.40", "uvicorn>=0.30"]

[project.scripts]
cva = "cva.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pypdf>=5.0", "ruff>=0.6", "starlette>=0.40", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cva"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
